[package]
name = "mock-server"
version.workspace = true
edition.workspace = true
description = "In-memory mock carrier: lib adapters + shared-carrier server (data + control plane)"

[lib]
name = "mock_server"
path = "src/lib.rs"

[[bin]]
name = "mock-server"
path = "src/main.rs"

[dependencies]
