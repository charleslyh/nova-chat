<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Verifier</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e3e6ea;
    --text: #1f2733; --muted: #6b7280; --accent: #3b82f6; --accent-soft: #eaf1fe;
    --user: #3b82f6; --user-text: #ffffff; --assistant: #f1f3f5; --assistant-text: #1f2733;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .brand { display: flex; align-items: center; gap: 8px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  header input[type=text] { flex: 1; max-width: 380px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  header button { padding: 7px 14px; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; font-size: 13px; cursor: pointer; }
  header button:hover { background: var(--accent-soft); }
  .layout { display: flex; height: calc(100vh - 57px); }
  .sessions { width: 260px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
  .sessions .head { padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
  .sessions .head span { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .sessions .head button { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .sessions ul { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; }
  .sessions li { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 2px; }
  .sessions li:hover { background: var(--accent-soft); }
  .sessions li.active { background: var(--accent); color: #fff; }
  .sessions li .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sessions li .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sessions li .st { font-size: 11px; opacity: .8; }
  .sessions li .del { border: none; background: transparent; cursor: pointer; font-size: 14px; color: inherit; opacity: .5; padding: 2px 4px; }
  .sessions li .del:hover { opacity: 1; }
  .chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chat .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .bubble { max-width: 72%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .bubble.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: var(--assistant); color: var(--assistant-text); border-bottom-left-radius: 4px; }
  .bubble.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; max-width: 90%; }
  .bubble .cursor { display: inline-block; width: 7px; height: 14px; background: currentColor; vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking { align-self: flex-start; max-width: 72%; margin: -6px 0 0; }
  .thinking summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; list-style: none; }
  .thinking summary::before { content: '💭 思考过程 '; }
  .thinking[open] summary::before { content: '💭 思考过程（收起）'; }
  .thinking .think-body { margin-top: 6px; padding: 8px 12px; color: var(--muted); font-size: 13px; background: #f8f9fa; border-left: 3px solid #d0d5dd; border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow-y: auto; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; }
  .composer { display: flex; gap: 10px; padding: 16px 24px; background: var(--panel); border-top: 1px solid var(--border); align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; min-height: 42px; max-height: 160px; }
  .composer textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .composer .opts { display: flex; flex-direction: column; gap: 6px; }
  .composer input[type=text] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; width: 150px; }
  .composer .opts label.tool-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); user-select: none; cursor: pointer; }
  .bubble.tool { align-self: flex-start; background: #fef9e7; color: #7a5b00; border: 1px solid #f0e2b6; border-bottom-left-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .composer button.send { border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 18px; font-size: 14px; cursor: pointer; height: 42px; }
  .composer button.send:disabled { opacity: .5; cursor: not-allowed; }
  .composer button.send:not(:disabled):hover { filter: brightness(1.05); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><h1>Nova Verifier</h1></div>
  <input type="text" id="base" placeholder="gateway base，如 http://localhost:18080/v1" title="能力服务网关地址">
  <button onclick="saveBase(); loadSessions();">连接</button>
  <button class="quick" onclick="quickCalc()" title="一键勾选计算器并发送示例，触发模型调用 calculate 工具走通完整 ReAct 回路">🧮 使用工具来计算</button>
</header>

<div class="layout">
  <aside class="sessions">
    <div class="head">
      <span>会话</span>
      <button onclick="createSession()" title="新建会话">＋ 新建</button>
    </div>
    <ul id="session-list"></ul>
  </aside>

  <main class="chat">
    <div class="messages" id="messages">
      <div class="empty">左侧新建或选择一个会话开始</div>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <div class="opts">
        <label class="tool-toggle" title="勾选后本轮请求会带上 calculate 工具，模型可调用它做算术"><input type="checkbox" id="calc"> 计算器</label>
        <input type="text" id="model" placeholder="模型名，如 gpt-4o（未设 NOVA_CHAT_MODEL 时必填）">
        <button class="send" id="send" onclick="send()">发送</button>
      </div>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let BASE = localStorage.getItem('nova_base') || 'http://localhost:18080/v1';
let current = null;   // { id } — 会话就是 conversation，id 即 conversation id
let streaming = false;
let eventSource = null;   // 当前会话的实时事件订阅（多设备同步）
// 单调递增的「渲染代际」：并发 `loadSessions` 时，只有最新一次有权写 ul，
// 早先的 await 回来后看到 `loadGen` 变了就放弃 append，否则同一对象会被
// 重复 append 多次（事件一来一去就翻倍）。
let loadGen = 0;

$('base').value = BASE;

function saveBase() {
  BASE = $('base').value.trim().replace(/\/+$/, '');
  localStorage.setItem('nova_base', BASE);
}

async function api(path, opts = {}) {
  const resp = await fetch(BASE + path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if (!resp.ok) {
    let detail = '';
    try { detail = (await resp.json())?.error?.message || ''; } catch {}
    throw new Error(`${resp.status} ${resp.statusText}${detail ? ' — ' + detail : ''}`);
  }
  return resp;
}

async function loadSessions() {
  const myGen = ++loadGen;                    // 占一个代际
  const list = $('session-list');
  list.innerHTML = '';
  let data;
  try {
    const resp = await api('/conversations');
    if (myGen !== loadGen) return;            // 已被更新的刷新取代，不再写 ul
    data = (await resp.json()).data || [];
  } catch (e) {
    if (myGen !== loadGen) return;
    list.innerHTML = `<li class="system">加载失败：${e.message}</li>`;
    return;
  }
  if (myGen !== loadGen) return;              // await 后再确认一次
  for (const s of data) {
    const li = document.createElement('li');
    li.className = current && current.id === s.id ? 'active' : '';
    const st = s.status === 'busy' ? '生成中…' : '空闲';
    li.innerHTML = `<div class="meta">
        <span class="id">${s.id}</span>
        <span class="st">${st}</span>
      </div>`;
    li.onclick = () => selectSession(s);
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除会话';
    del.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm('删除该会话？')) return;
      await api('/conversations/' + s.id, { method: 'DELETE' });
      if (current && current.id === s.id) { current = null; closeEvents(); $('messages').innerHTML = '<div class="empty">左侧新建或选择一个会话开始</div>'; }
      loadSessions();
    };
    li.appendChild(del);
    list.appendChild(li);
  }
}

async function createSession() {
  try {
    const resp = await api('/conversations', { method: 'POST', body: '{}' });
    const s = await resp.json();
    await loadSessions();
    selectSession(s);
  } catch (e) { alert('新建会话失败：' + e.message); }
}

async function selectSession(s) {
  current = { id: s.id };
  closeEvents();
  loadSessions();
  $('messages').innerHTML = '<div class="empty">加载对话…</div>';
  try {
    const resp = await api(`/conversations/${s.id}/transcript`);
    const items = (await resp.json()).data || [];
    renderTranscript(items);
    // 订阅该会话的事件流：另一个页面（设备）发起/结束一轮时，这里能实时看到。
    openEvents(s.id);
  } catch (e) {
    $('messages').innerHTML = `<div class="empty">加载历史失败：${e.message}</div>`;
  }
}

function closeEvents() {
  if (eventSource) { eventSource.close(); eventSource = null; }
}

// 订阅 `/conversations/{id}/events`：turn_started / turn_completed / response_deleted
// 边界事件一到，就重读 transcript 并刷新列表的「生成中/空闲」状态。这样 A 发消息
// 一轮结束后，B 无需任何操作就能看到 A 产生的新内容。
function openEvents(convId) {
  closeEvents();
  const es = new EventSource(BASE + `/conversations/${convId}/events`);
  eventSource = es;

  let timer = null;
  const scheduleReload = () => {
    if (timer) return;                       // 合并同一批到达的事件
    timer = setTimeout(() => { timer = null; refreshTranscript(); }, 150);
  };
  es.addEventListener('conversation.turn_started', () => { loadSessions(); scheduleReload(); });
  es.addEventListener('conversation.turn_completed', () => { loadSessions(); scheduleReload(); });
  es.addEventListener('conversation.response_deleted', scheduleReload);
  // 断线由 EventSource 自动重连（带 Last-Event-ID，从断点续传，不重放全量）。
  es.onerror = () => {};
}

async function refreshTranscript() {
  // 自己正在流式输出时不重画（自己的 conversation 也会发出 turn_completed，
  // 但那时本页已经在流式打字，重画会打断它；流式内容本就完整，无需补拉）。
  if (!current || streaming) return;
  try {
    const resp = await api(`/conversations/${current.id}/transcript`);
    const items = (await resp.json()).data || [];
    renderTranscript(items);
  } catch (e) { /* 静默：下一次边界事件会再试 */ }
}

function partText(part) {
  if (part.text !== undefined) return part.text;
  if (part.refusal !== undefined) return `[拒绝] ${part.refusal}`;
  return JSON.stringify(part);
}

function itemText(item) {
  if (item.type === 'message') {
    return (item.content || []).map(partText).join('\n');
  }
  if (item.type === 'function_call') {
    return `🔧 调用 ${item.name}(${item.arguments})`;
  }
  if (item.type === 'function_call_output') {
    return `⚙️ 结果：${item.output}`;
  }
  return JSON.stringify(item);
}

function appendThinking(text) {
  const box = $('messages');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const think = document.createElement('details');
  think.className = 'thinking';
  think.innerHTML = '<summary></summary><div class="think-body"></div>';
  think.querySelector('.think-body').textContent = text;
  box.appendChild(think);
  return think;
}

function renderTranscript(items) {
  const box = $('messages');
  box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = '<div class="empty">这是第一轮，说点什么吧</div>';
    return;
  }
  for (const item of items) {
    // reasoning 块不是对话气泡：渲染成可折叠的思考过程，与流式呈现一致。
    if (item.type === 'reasoning') {
      appendThinking(item.text || '');
      continue;
    }
    // 工具调用与结果渲染成独立的 tool 气泡，与流式呈现一致。
    if (item.type === 'function_call' || item.type === 'function_call_output') {
      appendBubble('tool', itemText(item));
      continue;
    }
    appendBubble(item.role === 'user' ? 'user' : (item.role === 'assistant' ? 'assistant' : 'system'), itemText(item));
  }
  box.scrollTop = box.scrollHeight;
}

function appendBubble(role, text) {
  const box = $('messages');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function send() {
  if (!current) { alert('请先选择一个会话'); return; }
  if (streaming) return;
  const input = $('input').value.trim();
  if (!input) return;
  const model = $('model').value.trim() || 'm';
  // 计算器工具（协议子集的 `tools`：仅 `type: "function"`）。勾选后模型可以
  // 调用 `calculate` 做算术，走通「function_call → 执行 → function_call_output →
  // 最终回答」的完整 ReAct 回路，用于验证整个服务的工具调用链路。
  //
  // 注意：**不发 `tool_choice` 强制**。实测 deepseek 在 `required` 或指定函数下
  // 会每一轮都再调一次工具，死循环到 max_tool_rounds 上限（incomplete）。靠强
  // description + 默认 `auto` 触发一次干净的调用即可。
  const useCalc = $('calc').checked;
  const tools = useCalc ? [{
    type: 'function',
    name: 'calculate',
    description: '用于做算术计算的工具。任何算术计算都必须调用此工具完成，禁止心算、禁止写示例代码、禁止直接在回复里给出结果。参数 expression 是纯算术表达式（数字、+ - * /、括号），例如 "3 * 7" 或 "(1+2)*3"。',
    parameters: {
      type: 'object',
      properties: {
        expression: { type: 'string', description: 'The arithmetic expression to evaluate, e.g. "3 * 7".' },
      },
      required: ['expression'],
    },
  }] : undefined;

  $('input').value = '';
  $('send').disabled = true;
  streaming = true;
  appendBubble('user', input);
  // 思考过程折叠块：只有收到 reasoning 增量才有内容，否则流结束即移除。
  const think = document.createElement('details');
  think.className = 'thinking';
  think.innerHTML = '<summary></summary><div class="think-body"></div>';
  const messages = $('messages');
  messages.appendChild(think);
  const thinkBody = think.querySelector('.think-body');
  const bubble = appendBubble('assistant', '');
  bubble.innerHTML = '<span class="cursor"></span>';

  let lastStatus = null;
  try {
    const resp = await fetch(BASE + '/responses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, input, conversation: current.id, stream: true, ...(tools ? { tools } : {}) }),
    });
    if (!resp.ok) {
      let detail = '';
      try { detail = (await resp.json())?.error?.message || ''; } catch {}
      throw new Error(`${resp.status} ${resp.statusText}${detail ? ' — ' + detail : ''}`);
    }
    await pumpSse(
      resp.body,
      (delta) => {
        const el = bubble.querySelector('.cursor');
        if (el) el.remove();
        bubble.textContent += delta;
        $('messages').scrollTop = $('messages').scrollHeight;
      },
      (ev) => {
        if (ev.type === 'response.reasoning_text.delta' && ev.delta) {
          thinkBody.textContent += ev.delta;
          messages.scrollTop = messages.scrollHeight;
        }
        // 工具调用与结果：`output_item.done` 时条目已完整，渲染成独立气泡。
        if (ev.type === 'response.output_item.done' && ev.item) {
          const item = ev.item;
          if (item.type === 'function_call') {
            appendBubble('tool', `🔧 调用 ${item.name}(${item.arguments})`);
          } else if (item.type === 'function_call_output') {
            appendBubble('tool', `⚙️ 结果：${item.output}`);
          }
        }
        if (ev.type === 'response.completed' || ev.type === 'response.failed' || ev.type === 'response.incomplete') {
          lastStatus = ev.response?.status ?? ev.status ?? ev.type.replace('response.', '');
        }
      },
    );
    const el = bubble.querySelector('.cursor');
    if (el) el.remove();
    // 没有思考内容就把折叠块撤掉，不留空壳。
    if (!thinkBody.textContent.trim()) think.remove();
    if (!bubble.textContent.trim()) {
      // 生成失败不是「空回复」：failed 表示 agent 没跑成（多半是 model/密钥/base_url
      // 不对），真实原因在运行 run.sh 的终端里 agentd 的 `scheduling failed` 日志。
      if (lastStatus === 'failed') {
        bubble.textContent = '[生成失败 · 见 run.sh 终端里 agentd 的 scheduling failed 日志]';
        bubble.className = 'bubble system';
      } else if (lastStatus === 'incomplete') {
        bubble.textContent = '[生成中断（incomplete），可能被截断]';
        bubble.className = 'bubble system';
      } else if (lastStatus) {
        bubble.textContent = `[${lastStatus} · 暂无文本]`;
      } else {
        bubble.textContent = '[空回复]';
      }
    }
  } catch (e) {
    bubble.textContent = '出错了：' + e.message;
    bubble.className = 'bubble system';
  } finally {
    streaming = false;
    $('send').disabled = false;
    $('input').focus();
  }
}

async function pumpSse(body, onDelta, onEvent) {
  const reader = body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of frame.split('\n')) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const payload = t.slice(5).trim();
        if (payload === '[DONE]' || !payload) continue;
        let ev;
        try { ev = JSON.parse(payload); } catch { continue; }
        if (ev.type === 'response.output_text.delta' && ev.delta) onDelta(ev.delta);
        if (onEvent) onEvent(ev);
      }
    }
  }
}

$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

loadSessions();

// 一键触发：勾选「计算器」+ 写入示例表达式 + 发送。专为「我想直接看工具调用
// 轨迹而不是自己打表达式」设计——靠强 description + auto 触发模型调用 calculate。
function quickCalc() {
  if (!current) { alert('请先选择一个会话'); return; }
  $('calc').checked = true;
  $('input').value = '用计算器算 123 * 1234 / 123 - 123 * 23.4';
  send();
}
</script>
</body>
</html>
