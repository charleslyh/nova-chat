name: chain-multi-turn
covers: [FR-16, CR-9]
oracles: [ChainBounded, SequenceContiguous]
steps:
  - action: create_conversation
    label: conv
  # Three turns against one conversation. Each completed turn appends its
  # input + output to the materialised snapshot (D30), so the snapshot grows to
  # six items across three turns.
  - action: create_response
    input: "turn one"
    key: chain-1
    conversation: conv
  - action: claim
  - action: complete
    output_text: "answer one"
  - action: create_response
    input: "turn two"
    key: chain-2
    conversation: conv
  - action: claim
  - action: complete
    output_text: "answer two"
  - action: create_response
    input: "turn three"
    key: chain-3
    conversation: conv
  - action: claim
  - action: complete
    output_text: "answer three"
  - action: resolve_chain
    from: conv
    expect_depth: 3
    expect_items: 6
