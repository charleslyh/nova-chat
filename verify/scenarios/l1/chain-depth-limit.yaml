name: chain-depth-limit
covers: [FR-17, CR-9, INV-41]
oracles: [ChainBounded]
steps:
  - action: create_response
    input: "one"
    key: cdl-1
    label: a
  - action: create_response
    input: "two"
    key: cdl-2
    previous: a
    label: b
  - action: create_response
    input: "three"
    key: cdl-3
    previous: b
    label: c
  - action: resolve_chain
    from: c
    max_depth: 3
    expect_depth: 3
  # Over the bound: an explicit error. Truncating here would silently drop
  # context and be invisible to the caller.
  - action: expect_chain_error
    from: c
    max_depth: 2
    reason: chain_too_long
