name: tenant-purge
covers: [FR-21, SEC-2]
oracles: []
steps:
  - action: create_response
    input: "mine one"
    key: tp-1
  - action: create_response
    input: "mine two"
    key: tp-2
  - action: create_response
    input: "theirs"
    key: tp-3
    tenant: tenant-b
    label: theirs
  - action: purge_tenant
    expect_min: 2
  # The other tenant's content is untouched by the purge.
  - action: resolve_chain
    from: theirs
    tenant: tenant-b
    expect_depth: 1
