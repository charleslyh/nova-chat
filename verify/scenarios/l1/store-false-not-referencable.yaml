name: store-false-not-referencable
covers: [FR-15, FR-18, CR-10, INV-43]
oracles: []
steps:
  - action: create_response
    input: "unstored"
    key: sf-1
    store: false
    label: unstored
  # Refused explicitly, and with a *specific* code: the response exists and
  # belongs to this tenant, it simply holds no items. Reporting it as merely
  # "broken" would hide the actual cause — the caller passed `store: false`
  # earlier and needs to know that is why chaining is impossible.
  - action: expect_chain_error
    from: unstored
    reason: not_stored
