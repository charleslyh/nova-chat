name: chain-delete-head-is-surgical
covers: [FR-21, CR-10, INV-43]
oracles: []
steps:
  - action: create_conversation
    label: conv
  - action: create_response
    input: "first question"
    key: cbe-1
    conversation: conv
    label: first
  - action: claim
  - action: complete
    output_text: "first answer"
  - action: create_response
    input: "second question"
    key: cbe-2
    conversation: conv
    label: second
  - action: claim
  - action: complete
    output_text: "second answer"
  # Deleting the head is record-level: the deleted response's record is gone,
  # but the conversation snapshot — a flat accumulation taken at each turn —
  # keeps the full history, deleted link included (D30).
  - action: delete_response
    target: first
  # The deleted link's record can no longer be addressed.
  - action: expect_stored
    target: first
    exists: false
  # The snapshot still resolves with the full two-turn history intact.
  - action: resolve_chain
    from: conv
    expect_depth: 2
    expect_items: 4
