name: instructions-not-inherited
covers: [FR-19, INV-49]
oracles: [ChainBounded]
steps:
  - action: create_conversation
    label: conv
  - action: create_response
    input: "first"
    key: ins-1
    conversation: conv
    instructions: "SPEAK-LIKE-A-PIRATE"
  - action: claim
  - action: complete
    output_text: "arr"
  - action: create_response
    input: "second"
    key: ins-2
    conversation: conv
  - action: claim
  - action: complete
    output_text: "answer"
  # The previous turn's instructions must not reappear in assembled context.
  # `instructions` is echoed on the response object but never appended to the
  # conversation snapshot, so it cannot leak into the next turn (INV-49).
  - action: resolve_chain
    from: conv
    expect_depth: 2
    expect_absent_text: "SPEAK-LIKE-A-PIRATE"
