name: overload-reject-consistent
# CR-8 was claimed here and moved to the L0 `overload-integrity` case: these
# steps are serial, and CR-8 is about integrity *under pressure*. What this
# scenario does establish is that a refusal is well-formed and leaves accepted
# work unaffected.
covers: [FR-33, INV-29, INV-30]
oracles: [SequenceContiguous, SingleClaimPerAttempt, IdempotentSameResponse]
steps:
  - action: set_pending_limit
    limit: 1
  - action: create_response
    input: "accepted"
    key: ocr-1
  - action: create_response
    input: "rejected"
    key: ocr-2
    expect: overloaded
  # The already-accepted response is unaffected and completes normally.
  - action: claim
  - action: append_delta
  - action: complete
