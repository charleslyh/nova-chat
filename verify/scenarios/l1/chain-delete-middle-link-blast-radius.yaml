name: chain-delete-middle-link-blast-radius
covers: [FR-21, CR-10, INV-43]
oracles: []
# What a deletion costs, stated exactly.
#
# Under D30 the conversation snapshot is the single durable copy of history.
# Deleting a response removes its record and event stream only — the snapshot's
# inherited content is untouched, so a later read still sees every turn that
# ever completed. "Remove the record" is not "erase the conversation".
steps:
  - action: create_conversation
    label: conv
  - action: create_response
    input: "turn A"
    key: cdm-a
    conversation: conv
    label: a
  - action: claim
  - action: complete
    output_text: "answer A"
  - action: create_response
    input: "turn B"
    key: cdm-b
    conversation: conv
    label: b
  - action: claim
  - action: complete
    output_text: "answer B"
  - action: create_response
    input: "turn C"
    key: cdm-c
    conversation: conv
    label: c
  - action: claim
  - action: complete
    output_text: "answer C"
  # Baseline: the whole snapshot reads back, three turns, six items.
  - action: resolve_chain
    from: conv
    expect_depth: 3
    expect_items: 6
  # Remove the middle turn's record only.
  - action: delete_response
    target: b
  # The snapshot still carries the full three-turn history — deleting B's record
  # does not strip B's content from the conversation snapshot.
  - action: resolve_chain
    from: conv
    expect_depth: 3
    expect_items: 6
  # B is genuinely gone as a record.
  - action: expect_stored
    target: b
    exists: false
  # A and C's records are untouched.
  - action: expect_stored
    target: a
    exists: true
  - action: expect_stored
    target: c
    exists: true
