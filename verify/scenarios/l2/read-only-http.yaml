name: read-only-http
covers: [FR-33, INV-32, OR-2]
oracles: []
steps:
  - action: http_post
    url: http://127.0.0.1:18080/v1/admin/read_only
    body: '{"enabled":true}'
    expect_status: 200
    expect_contains: '"read_only":true'
  # Degradation is visible to the caller, never silent.
  - action: http_post
    url: http://127.0.0.1:18080/v1/responses
    body: '{"model":"m","input":"blocked","background":true}'
    expect_status: 503
  - action: http_post
    url: http://127.0.0.1:18080/v1/admin/read_only
    body: '{"enabled":false}'
    expect_status: 200
  - action: http_post
    url: http://127.0.0.1:18080/v1/responses
    body: '{"model":"m","input":"allowed","background":true}'
    expect_status: 202
