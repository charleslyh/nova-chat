[package]
name = "adapters-sql"
version.workspace = true
edition.workspace = true
description = "PostgreSQL adapters: context store + response ledger (production carrier, L3)"

[dependencies]
nova-responses-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# `macros` is present only for `sqlx::migrate!` (embeds migration files at
# compile time, no database needed). The compile-time query-checking macros
# `query!`/`query_as!` are deliberately NOT used, because those would make every
# build depend on a reachable database and break D17.
sqlx = { workspace = true }
