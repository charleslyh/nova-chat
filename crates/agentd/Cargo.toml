[package]
name = "nova-agentd"
version.workspace = true
edition.workspace = true
description = "Standalone execution daemon: claims from the shared ledger and runs the ReAct loop (D25)"

[[bin]]
name = "nova-agentd"
path = "src/main.rs"

[dependencies]
nova-agent = { workspace = true }
nova-responses-core = { workspace = true }
adapters-mem-client = { workspace = true }
adapters-completions-mock = { workspace = true }
adapters-completions-http = { workspace = true }
adapters-tool-calculator = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
