[package]
name = "nova-agentd"
version.workspace = true
edition.workspace = true
description = "Standalone execution daemon: claims from the shared ledger and runs the ReAct loop (D25)"

[[bin]]
name = "nova-agentd"
path = "src/main.rs"

[features]
# 默认 mem：L2 验证用共享载体的客户端桩。生产构建用
# `--no-default-features --features sql`，静态排除 mem 客户端。
default = ["mem"]
mem = ["dep:adapters-mem-client"]
sql = ["dep:adapters-sql", "dep:adapters-event-log-redis"]

[dependencies]
nova-agent = { workspace = true }
nova-responses-core = { workspace = true }
adapters-mem-client = { workspace = true, optional = true }
adapters-sql = { workspace = true, optional = true }
adapters-event-log-redis = { workspace = true, optional = true }
adapters-completions-mock = { workspace = true }
adapters-completions-http = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
