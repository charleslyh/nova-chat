[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/adapters/mem",
    "crates/gateway",
    "testing/conformance",
    "testing/harness",
    "testing/mock-agent",
    "testing/sim",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nova-sessions-core = { path = "crates/core" }
adapters-mem = { path = "crates/adapters/mem" }
conformance = { path = "testing/conformance" }
harness = { path = "testing/harness" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
toml = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
