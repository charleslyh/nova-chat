[workspace]
resolver = "2"
members = [
    "crates/agent-runtime",
    "crates/executor",
    "crates/responses",
    "gateway",
    "verify/mock/server",
    "verify/mock/client",
    "verify/mock/agentd",
    "verify/conformance",
    "verify/harness",
    "verify/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nova-responses = { path = "crates/responses" }
nova-executor = { path = "crates/executor" }
mock-server = { path = "verify/mock/server" }
mock-client = { path = "verify/mock/client" }
mock-agentd = { path = "verify/mock/agentd" }
nova-agent-runtime = { path = "crates/agent-runtime" }
conformance = { path = "verify/conformance" }
harness = { path = "verify/harness" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
toml = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# The chat-completions client rides reqwest 0.13 (async-openai 0.42), and the
# executor names that client type so a round carrying passthrough headers can
# build its own client on the SAME connection pool. Aliased because the
# gateway's own HTTP work is still on 0.12.
openai-reqwest = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream"] }
# Content integrity (D20 ⑧ / INV-44): canonicalisation + tamper detection.
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
unicode-normalization = "0.1"
# SSRF defence in depth for image/file reference URLs (SEC-6).
url = "2"
# Hex encoding for integrity tags.
hex = "0.4"
# Enum-to-string derivation so wire names have one source of truth.
strum = { version = "0.26", features = ["derive"] }
# Chat-completions wire client for the executor. The only git dependency in
# this workspace, and a deliberate one: hand-rolling the request/response types
# would mean owning the optionality of every provider-variant field, and
# getting that wrong surfaces as a deserialisation failure against a live
# model rather than at compile time. CI therefore needs access to git.woa.com.
# …pinned to a rev that carries `reasoning_content`: a provider that streams the
# chain of thought in its own field (hy4) is invisible to the typed schema
# without it, and no upstream release has the field.
async-openai = { git = "https://git.woa.com/yuanbao-multimodal/async-openai.git", rev = "57a0cf8faa51930e1de59192374e580a7d1f7dfe", features = ["chat-completion"] }
# Stream construction for the executor's streaming turn.
async-stream = "0.3"
