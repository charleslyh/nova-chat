[workspace]
resolver = "2"
members = [
    "crates/agent-runtime",
    "crates/sweep",
    "crates/responses",
    "gateway",
    "verify/mock/server",
    "verify/mock/client",
    "verify/mock/agentd",
    "verify/mock/sweep",
    "verify/conformance",
    "verify/harness",
    "verify/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nova-responses = { path = "crates/responses" }
nova-responses-sweep = { path = "crates/sweep" }
mock-server = { path = "verify/mock/server" }
mock-client = { path = "verify/mock/client" }
mock-agentd = { path = "verify/mock/agentd" }
mock-sweep = { path = "verify/mock/sweep" }
nova-agent-runtime = { path = "crates/agent-runtime" }
conformance = { path = "verify/conformance" }
harness = { path = "verify/harness" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
toml = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Content integrity (D20 ⑧ / INV-44): canonicalisation + tamper detection.
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
unicode-normalization = "0.1"
# SSRF defence in depth for image/file reference URLs (SEC-6).
url = "2"
# Hex encoding for integrity tags.
# Enum-to-string derivation so wire names have one source of truth.
strum = { version = "0.26", features = ["derive"] }
