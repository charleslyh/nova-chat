# Local / CI deployment of the response service.
#
# Three peer gateway nodes plus PostgreSQL. Every node is equivalent: each can
# create, each runs its own sweeper, and there is no authority node (D20).
#
# Not used by L0–L2 verification, which runs on bare processes via `just procs`
# and requires no Docker (D17). This file exists for L3 and local demos.
#
# Secrets come from the environment (see .env.example) and are never written into
# config files (SEC-4).

x-gateway-common: &gateway-common
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  environment:
    # Named here, valued from .env — the config files only reference the names.
    NOVA_DATABASE_URL: postgres://nova:${POSTGRES_PASSWORD}@postgres:5432/nova
    NOVA_INTEGRITY_KEY: ${NOVA_INTEGRITY_KEY}
    NOVA_INTERNAL_TOKEN: ${NOVA_INTERNAL_TOKEN}
    NOVA_API_KEYS: ${NOVA_API_KEYS}
    NOVA_ADMIN_KEY: ${NOVA_ADMIN_KEY}
    RUST_LOG: ${RUST_LOG:-info}
  depends_on:
    postgres:
      condition: service_healthy
  # Long grace period so graceful drain can finish. Killing a node mid-generation
  # is precisely the loss that drain exists to prevent, so a short grace period
  # here would silently undo the highest-value reliability measure (D21).
  stop_grace_period: 11m
  stop_signal: SIGTERM
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nova
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOTE: a single container is for local use only. Production requires a
    # managed instance with a standby in another availability zone plus periodic
    # backups (D21 ①).

  # Shared in-flight event carrier (D25). Per-response streams are cheap and
  # self-bounded via MAXLEN + TTL; a single container is for local/L3 use only.
  redis:
    image: redis:7-alpine
    profiles: ["full"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redisdata:/data

  node-a:
    <<: *gateway-common
    profiles: ["full"]
    command: ["--config", "/etc/nova/node-a.toml"]
    volumes:
      - ../../testing/config/node-a-sql.toml:/etc/nova/node-a.toml:ro
    ports:
      - "18080:18080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/nova-healthcheck", "http://127.0.0.1:18080/health"]
      interval: 5s
      timeout: 3s
      retries: 6

  node-b:
    <<: *gateway-common
    profiles: ["full"]
    command: ["--config", "/etc/nova/node-b.toml"]
    volumes:
      - ../../testing/config/node-b-sql.toml:/etc/nova/node-b.toml:ro
    ports:
      - "18081:18081"

  # Keeps `docker compose config` valid without pulling the full stack.
  placeholder:
    image: alpine:3.20
    command: ["true"]
    profiles: ["manual"]

volumes:
  pgdata:
  redisdata:
