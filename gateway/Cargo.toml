[package]
name = "nova-responses-gateway"
version.workspace = true
edition.workspace = true
description = "Gateway: HTTP ingress layer (lib) + assembly shell (bin) over nova-responses"

[lib]
name = "nova_responses_gateway"
path = "src/lib.rs"

[[bin]]
name = "nova-responses-gateway"
path = "src/main.rs"

[dependencies]
nova-responses = { workspace = true }
nova-responses-sweep = { workspace = true }
mock-client = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The HTTP contract test drives the gateway lib with the mem backend and an
# embedded agent injected in process — test-only, never part of the production
# dependency surface.
mock-server = { workspace = true }
nova-agent-runtime = { workspace = true }
mock-agentd = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
