<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova Sim — Session Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1c1a;
      --muted: #5a6b67;
      --line: #c5d2ce;
      --paper: #e8eeec;
      --panel: #f6f9f8;
      --home: #0d7377;
      --edge: #3d5a80;
      --ok: #1b7f4a;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 0% 0%, #d5eae6 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #efe4da 0%, transparent 45%),
        var(--paper);
    }
    .app { height: 100%; display: grid; grid-template-rows: 48px 1fr; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem; border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      backdrop-filter: blur(8px);
    }
    .topbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: -0.03em; }
    .topbar .hint { color: var(--muted); font-size: 0.78rem; margin-left: 0.75rem; }
    .topbar-actions { display: flex; gap: 0.4rem; }
    button {
      font: inherit; cursor: pointer;
      border: 1px solid var(--ink); background: var(--ink); color: #f4f7f6;
      padding: 0.28rem 0.65rem; border-radius: 2px;
    }
    button.ghost { background: transparent; color: var(--ink); }
    button.warn { background: #8a3b18; border-color: #8a3b18; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .layout {
      height: 100%; display: grid;
      grid-template-columns: 420px 1fr 360px;
      min-height: 0; overflow: hidden;
    }
    .pane {
      min-height: 0; display: flex; flex-direction: column;
      background: var(--panel); border-right: 1px solid var(--line);
      overflow: hidden;
    }
    .pane:last-child { border-right: none; }
    .pane-h {
      flex: 0 0 auto; padding: 0.4rem 0.65rem;
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--line);
    }
    .pane-b { flex: 1; min-height: 0; overflow: auto; padding: 0.65rem; }
    .region {
      border: 1px solid var(--line); padding: 0.55rem; margin-bottom: 0.5rem;
      background: #fff;
    }
    .region.home { border-left: 3px solid var(--home); }
    .region.edge { border-left: 3px solid var(--edge); }
    .region h3 { margin: 0 0 0.25rem; font-size: 0.95rem; }
    .meta { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; color: var(--muted); }
    .row { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.4rem; }
    .badge {
      display: inline-block; font-size: 0.65rem; padding: 0.1rem 0.35rem;
      border-radius: 2px; background: #e2ece9;
    }
    .badge.ok { background: #d5f0e3; color: var(--ok); }
    .badge.bad { background: #f8e0de; color: var(--bad); }
    #stream-log, #timeline {
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
      white-space: pre-wrap; line-height: 1.45;
    }
    .stream-box {
      background: #101816; color: #cfe7e1; min-height: 180px;
      padding: 0.5rem; border-radius: 2px; margin-top: 0.5rem;
      max-height: 40vh; overflow: auto;
    }
    label { font-size: 0.78rem; color: var(--muted); display: block; margin-top: 0.5rem; }
    input, select, textarea {
      width: 100%; font: inherit; padding: 0.35rem; margin-top: 0.2rem;
      border: 1px solid var(--line); background: #fff;
    }
    textarea { min-height: 64px; resize: vertical; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div style="display:flex;align-items:baseline">
        <h1>Nova Sim</h1>
        <span class="hint">Session 流 · 单 API · POST+SSE</span>
      </div>
      <div class="topbar-actions">
        <a href="/chat" style="font-size:0.85rem;color:var(--home);text-decoration:none;margin-right:0.5rem">Chat →</a>
        <button id="btn-preset">两区预设</button>
        <button class="warn ghost" id="btn-stop">全部停止</button>
      </div>
    </header>
    <div class="layout">
      <section class="pane">
        <div class="pane-h">拓扑 · nova-sessions-gateway</div>
        <div class="pane-b" id="regions"></div>
      </section>
      <section class="pane">
        <div class="pane-h">Session / Turn / SSE</div>
        <div class="pane-b">
          <label>经区域发请求</label>
          <select id="region-sel"></select>
          <div class="row" style="margin-top:0.6rem">
            <button id="btn-session">建 Session</button>
          </div>
          <label>当前 Session</label>
          <input id="session-id" placeholder="session uuid" />
          <label>Turn 文本</label>
          <textarea id="turn-text">hello from sim</textarea>
          <div class="row">
            <button id="btn-turn">发 Turn</button>
            <button class="ghost" id="btn-sse">订阅 SSE</button>
            <button class="ghost" id="btn-sse-stop">断开 SSE</button>
          </div>
          <label>游标 last_seq</label>
          <input id="last-seq" value="0" />
          <div class="stream-box" id="stream-log">（尚未订阅）</div>
        </div>
      </section>
      <section class="pane">
        <div class="pane-h">时间线</div>
        <div class="pane-b"><div id="timeline"></div></div>
      </section>
    </div>
  </div>
  <script>
    let es = null;
    let state = { regions: [], sessions: [], timeline: [] };

    async function api(path, opts = {}) {
      const r = await fetch(path, {
        headers: { "content-type": "application/json" },
        ...opts,
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.statusText);
      return j;
    }

    async function refresh() {
      state = await api("/api/state");
      render();
    }

    function render() {
      const box = document.getElementById("regions");
      box.innerHTML = "";
      const sel = document.getElementById("region-sel");
      const cur = sel.value;
      sel.innerHTML = "";
      for (const r of state.regions || []) {
        const d = document.createElement("div");
        d.className = "region " + (r.role === "home" ? "home" : "edge");
        d.innerHTML = `
          <h3>${r.id} <span class="badge">${r.role}</span>
            <span class="badge ${r.healthy ? "ok" : "bad"}">${r.healthy ? "healthy" : "down"}</span>
          </h3>
          <div class="meta">${r.listen}${r.home_upstream ? " → " + r.home_upstream : ""}</div>
          <div class="meta">agents: ${(r.agents || []).length}</div>
          <div class="row">
            <button data-start="${r.id}">启动 sessions</button>
            <button class="ghost" data-stop="${r.id}">停止</button>
            <button class="ghost" data-agent="${r.id}">+ Agent</button>
          </div>`;
        box.appendChild(d);
        const o = document.createElement("option");
        o.value = r.id; o.textContent = r.id + " (" + r.role + ")";
        sel.appendChild(o);
      }
      if (cur) sel.value = cur;
      box.querySelectorAll("[data-start]").forEach(b => b.onclick = () => api("/api/regions/" + b.dataset.start + "/start", { method: "POST", body: "{}" }).then(refresh));
      box.querySelectorAll("[data-stop]").forEach(b => b.onclick = () => api("/api/regions/" + b.dataset.stop + "/stop", { method: "POST", body: "{}" }).then(refresh));
      box.querySelectorAll("[data-agent]").forEach(b => b.onclick = () => api("/api/regions/" + b.dataset.agent + "/agents", { method: "POST", body: "{}" }).then(refresh));

      const tl = document.getElementById("timeline");
      tl.textContent = (state.timeline || []).slice().reverse().map(e =>
        `${String(e.t_ms).padStart(6)}  ${e.action}  ${e.node_id}  ${e.session_id || ""}  ${e.detail || ""}`
      ).join("\n");
    }

    document.getElementById("btn-preset").onclick = async () => {
      await api("/api/preset/two-region", { method: "POST", body: "{}" });
      await refresh();
    };
    document.getElementById("btn-stop").onclick = async () => {
      if (es) { es.close(); es = null; }
      await api("/api/stop-all", { method: "POST", body: "{}" });
      await refresh();
    };
    document.getElementById("btn-session").onclick = async () => {
      const region_id = document.getElementById("region-sel").value;
      const j = await api("/api/sessions", { method: "POST", body: JSON.stringify({ region_id }) });
      document.getElementById("session-id").value = j.session_id;
      document.getElementById("last-seq").value = "0";
      await refresh();
    };
    document.getElementById("btn-turn").onclick = async () => {
      const id = document.getElementById("session-id").value.trim();
      const region_id = document.getElementById("region-sel").value;
      const text = document.getElementById("turn-text").value;
      await api("/api/sessions/" + id + "/turns", {
        method: "POST",
        body: JSON.stringify({ text, region_id }),
      });
      await refresh();
    };

    function listenBase() {
      const rid = document.getElementById("region-sel").value;
      const r = (state.regions || []).find(x => x.id === rid);
      return r ? ("http://" + r.listen) : null;
    }

    document.getElementById("btn-sse").onclick = () => {
      const base = listenBase();
      const sid = document.getElementById("session-id").value.trim();
      if (!base || !sid) return alert("需要区域与 session");
      if (es) es.close();
      let from = Number(document.getElementById("last-seq").value || "0");
      if (from < 1) from = 1;
      const log = document.getElementById("stream-log");
      log.textContent = "";
      es = new EventSource(base + "/v1/sessions/" + sid + "/stream?from_seq=" + from);
      es.onmessage = (ev) => {
        log.textContent += ev.data + "\n";
        log.scrollTop = log.scrollHeight;
        if (ev.lastEventId) document.getElementById("last-seq").value = ev.lastEventId;
      };
      es.addEventListener("error", () => {
        /* browser auto-reconnects; for gap 409 EventSource may fail */
      });
    };
    document.getElementById("btn-sse-stop").onclick = () => {
      if (es) { es.close(); es = null; }
    };

    setInterval(refresh, 2000);
    refresh();
  </script>
</body>
</html>
