name: directed-routing-resume
covers: [FR-14, FR-30, INV-12]
oracles: []
steps:
  # Created on node-a, so node-a owns the in-flight event buffer.
  - action: http_post
    url: http://127.0.0.1:18080/v1/responses
    body: '{"model":"m","input":"route me","background":true}'
    expect_status: 202
    capture:
      rid: id
  - action: sleep_ms
    ms: 600
  # Subscribing via node-b must transparently reach node-a. This hop is a
  # permanent architectural feature: the buffer lives in one process's heap and
  # there is no shared endpoint another node could connect to.
  - action: http_sse_collect
    url: http://127.0.0.1:18081/v1/responses/{{rid}}?stream=true
    expect_min_events: 2
    max_events: 4
    capture_last_seq: cursor
  # Resume from the observed cursor, again through the non-owning node.
  - action: http_sse_collect
    url: http://127.0.0.1:18081/v1/responses/{{rid}}?stream=true&starting_after={{cursor}}
    expect_min_events: 1
    max_events: 2
