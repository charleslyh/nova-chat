name: health-and-create
covers: [FR-1, FR-2, FR-29]
oracles: []
# Node roles across the L2 suite (there is no per-scenario fixture reset, so this
# division is what keeps scenarios independent):
#   node-a — normal flow; the mock agent is attached here
#   node-b — routing and graceful drain
#   node-c — overload and abrupt failure; deliberately has no agent, so anything
#            created here stays in flight forever
# Hence this scenario creates on a and b only: leaving an in-flight response on
# node-c would consume the budget that `pending-limit-http` depends on.
steps:
  - action: http_get
    url: http://127.0.0.1:18080/health
    expect_status: 200
    expect_contains: '"accepting":true'
  # Every node is equivalent — there is no authority node to route writes to.
  - action: http_post
    url: http://127.0.0.1:18080/v1/responses
    body: '{"model":"m","input":"from node a","background":true}'
    expect_status: 202
    expect_contains: '"status":"queued"'
  - action: http_post
    url: http://127.0.0.1:18081/v1/responses
    body: '{"model":"m","input":"from node b","background":true}'
    expect_status: 202
  # node-c is only probed for liveness, for the reason given above.
  - action: http_get
    url: http://127.0.0.1:18082/health
    expect_status: 200
    expect_contains: '"node_tag":"node-c"'
