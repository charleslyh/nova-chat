name: edge-read-mirror
covers:
  - FR-10
  - INV-32
oracles: []
trace: true
steps:
  - action: http_post
    url: http://127.0.0.1:18081/v1/sessions
    expect_contains: session_id
    capture:
      session_id: session_id
  - action: http_post
    url: http://127.0.0.1:18081/v1/sessions/{{session_id}}/turns
    body: '{"text":"via-edge-mirror","idempotency_key":"l2-m1"}'
    expect_status: 202
  - action: http_get_until
    url: http://127.0.0.1:18080/v1/sessions/{{session_id}}/snapshot
    expect_contains: '"running":[]'
    timeout_ms: 10000
  # Edge GET serves local mirror (pull-projected), not sticky home connection
  - action: http_get_until
    url: http://127.0.0.1:18081/v1/sessions/{{session_id}}/snapshot
    expect_contains: via-edge-mirror
    timeout_ms: 10000
  - action: http_sse_collect
    url: http://127.0.0.1:18081/v1/sessions/{{session_id}}/stream?from_seq=1
    expect_min_events: 2
    max_events: 16
    timeout_ms: 8000
  # INV-32: home read-only → edge write 503; edge mirror read still 200
  - action: http_post
    url: http://127.0.0.1:18080/v1/admin/read_only
    body: '{"enabled":true}'
    expect_contains: '"read_only":true'
  - action: http_post
    url: http://127.0.0.1:18081/v1/sessions/{{session_id}}/turns
    body: '{"text":"blocked","idempotency_key":"l2-m-ro"}'
    expect_status: 503
    expect_contains: read_only
  - action: http_get
    url: http://127.0.0.1:18081/v1/sessions/{{session_id}}/snapshot
    expect_status: 200
    expect_contains: via-edge-mirror
  - action: http_post
    url: http://127.0.0.1:18080/v1/admin/read_only
    body: '{"enabled":false}'
    expect_contains: '"read_only":false'
