name: node-down-abrupt
covers: [FR-38, CR-6, INV-40]
oracles: []
# Kills node-c abruptly; nothing restarts it within a run.
destructive: true
requires_nodes: [18082, 18080]
steps:
  # Created on node-c, which has no agent attached, so it stays in flight.
  - action: http_post
    url: http://127.0.0.1:18082/v1/responses
    body: '{"model":"m","input":"will be orphaned","background":true}'
    expect_status: 202
    capture:
      rid: id
  - action: sleep_ms
    ms: 300
  # Abrupt loss of the host node: its in-flight buffer dies with the process. This
  # is the accepted cost of keeping ~20k events/s out of shared middleware, and
  # the reason graceful drain matters so much for the *planned* case.
  - action: kill_listener
    port: 18082
  - action: sleep_ms
    ms: 600
  # A peer cannot serve the stream: the host is gone. Failing loudly is required —
  # inventing a partial view would be a silent correctness violation (INV-40).
  - action: http_get
    url: http://127.0.0.1:18080/v1/responses/{{rid}}?stream=true
    expect_status: 502
