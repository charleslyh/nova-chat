name: pending-limit-http
covers: [FR-33, INV-29, INV-30]
oracles: []
steps:
  - action: http_post
    url: http://127.0.0.1:18082/v1/admin/pending_limit
    body: '{"pending_limit":1}'
    expect_status: 200
  - action: http_post
    url: http://127.0.0.1:18082/v1/responses
    body: '{"model":"m","input":"first","background":true}'
    expect_status: 202
  # Node-c has no agent attached, so the first response stays in flight and the
  # second must be refused with a retryable status.
  - action: http_post
    url: http://127.0.0.1:18082/v1/responses
    body: '{"model":"m","input":"second","background":true}'
    expect_status: 429
  - action: http_post
    url: http://127.0.0.1:18082/v1/admin/pending_limit
    body: '{"pending_limit":10000}'
    expect_status: 200
