name: home-turn-idempotent
covers:
  - CR-2
  - FR-1
oracles: []
trace: true
steps:
  - action: http_post
    url: http://127.0.0.1:18080/v1/sessions
    expect_contains: session_id
    capture:
      session_id: session_id
  - action: http_post
    url: http://127.0.0.1:18080/v1/sessions/{{session_id}}/turns
    body: '{"text":"once","idempotency_key":"l2-idem-1"}'
    expect_contains: turn_id
    capture:
      turn_id: turn_id
  - action: http_post
    url: http://127.0.0.1:18080/v1/sessions/{{session_id}}/turns
    body: '{"text":"once-again","idempotency_key":"l2-idem-1"}'
    expect_contains: '{{turn_id}}'
  - action: http_get_until
    url: http://127.0.0.1:18080/v1/sessions/{{session_id}}/snapshot
    expect_contains: '"running":[]'
    timeout_ms: 10000
