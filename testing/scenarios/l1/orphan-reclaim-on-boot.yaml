name: orphan-reclaim-on-boot
covers: [FR-35, FR-38, CR-6, INV-45]
oracles: [CreatedResponsesTerminal]
steps:
  - action: create_response
    input: "interrupted"
    key: orb-1
  - action: claim
  - action: append_delta
  # Stands in for a process restart: everything non-terminal on this node is
  # failed at once, instead of hanging until the heartbeat TTL expires.
  - action: reclaim_orphans
    expect_min: 1
