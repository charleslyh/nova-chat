name: internal-url-rejected
covers: [FR-26, SEC-6]
oracles: []
steps:
  # The execution side fetches these URLs, so cloud metadata endpoints and
  # private ranges have to be refused at the request boundary.
  - action: expect_protocol_reject
    body: '{"model":"m","input":[{"type":"message","role":"user","content":[{"type":"input_image","image_url":"https://169.254.169.254/latest/meta-data/"}]}]}'
  - action: expect_protocol_reject
    body: '{"model":"m","input":[{"type":"message","role":"user","content":[{"type":"input_image","image_url":"https://10.0.0.1/x.png"}]}]}'
  - action: expect_protocol_reject
    body: '{"model":"m","input":[{"type":"message","role":"user","content":[{"type":"input_file","file_url":"http://example.com/a.pdf"}]}]}'
  - action: expect_protocol_accept
    body: '{"model":"m","input":[{"type":"message","role":"user","content":[{"type":"input_image","image_url":"https://cdn.example.com/a.png"}]}]}'
