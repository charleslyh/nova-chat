name: hot-miss-gap
covers:
  - FR-13
  - FR-14
  - INV-14
  - CR-4
oracles:
  - SeqMonotonic
  - SubmittedTurnsTerminal
  - NoSilentGap
trace: true
steps:
  - action: create_session
  - action: submit_turn
    text: gap-me
    key: k-gap-1
  - action: claim_and_complete
    tokens: 3
  # tip = turn_begin(1) + 3 deltas + turn_done(5)
  - action: snapshot_put
    snapshot_seq: 5
    expect: ok
  - action: trim_earliest
    new_earliest: 3
  - action: expect_cold_min
    min_events: 2
  - action: expect_gap
    from_seq: 1
    expect_hint: recover_via_snapshot
  - action: expect_no_gap
    from_seq: 3
  - action: snapshot_get
    expect_seq: 5
  # 开屏恢复：snapshot_seq → SSE/read from_seq（热层仍含 tip）
  - action: resume_from
    from_seq: 5
    expect_min_events: 1
