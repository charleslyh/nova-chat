name: hot-miss-gap
covers:
  - FR-13
  - FR-14
  - INV-14
  - CR-4
oracles:
  - SeqMonotonic
  - SubmittedTurnsTerminal
  - NoSilentGap
trace: true
steps:
  - action: create_session
  - action: submit_turn
    text: gap-me
    key: k-gap-1
  - action: claim_and_complete
    tokens: 3
  - action: trim_earliest
    new_earliest: 3
  - action: expect_gap
    from_seq: 1
  - action: expect_no_gap
    from_seq: 3
