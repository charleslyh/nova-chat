name: idempotent-submit
covers:
  - CR-2
  - INV-2
oracles:
  - SeqMonotonic
  - IdempotentSameTurn
  - SubmittedTurnsTerminal
trace: true
steps:
  - action: create_session
  - action: submit_turn
    text: hello
    key: k-idem-1
    expect: accepted
  - action: submit_turn
    text: hello-again
    key: k-idem-1
    expect: duplicate
  - action: submit_turn
    text: other
    key: k-idem-2
    expect: busy
  - action: claim_and_complete
    tokens: 2
