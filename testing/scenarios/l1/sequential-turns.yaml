name: sequential-turns
covers:
  - FR-5
  - FR-8
  - INV-12
oracles:
  - SeqMonotonic
  - SingleClaimPerAttempt
  - SubmittedTurnsTerminal
trace: true
steps:
  - action: create_session
  - action: submit_turn
    text: turn-1
    key: k-seq-1
    expect: accepted
  - action: expect_lock
    state: busy
  - action: claim_and_complete
    tokens: 2
  - action: expect_lock
    state: idle
  - action: submit_turn
    text: turn-2
    key: k-seq-2
    expect: accepted
  - action: claim_and_complete
    tokens: 3
  - action: expect_lock
    state: idle
  - action: resume_from
    from_seq: 1
    expect_min_events: 7
  - action: expect_no_gap
    from_seq: 1
