name: double-claim
covers: [FR-4, CR-1, INV-1]
oracles: [SingleClaimPerAttempt]
steps:
  - action: create_response
    input: "one"
    key: dc-1
  - action: claim
  # Only one response was queued, so a second claim must find nothing rather than
  # hand the same work out twice.
  - action: claim
    expect: none
