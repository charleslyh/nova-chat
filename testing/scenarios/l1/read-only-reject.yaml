name: read-only-reject
covers: [FR-33, INV-32]
oracles: [NoSilentContentLoss]
steps:
  - action: set_read_only
    enabled: true
  - action: create_response
    input: "blocked"
    key: ro-1
    expect: read_only
  - action: set_read_only
    enabled: false
  - action: create_response
    input: "allowed"
    key: ro-2
