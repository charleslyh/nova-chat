name: pending-limit-overload
covers: [FR-33, INV-29, INV-30]
oracles: [IdempotentSameResponse, NoSilentContentLoss]
steps:
  - action: set_pending_limit
    limit: 1
  - action: create_response
    input: "first"
    key: ovl-1
  - action: create_response
    input: "second"
    key: ovl-2
    expect: overloaded
  # Raising the limit restores service: the rejection left nothing inconsistent.
  - action: set_pending_limit
    limit: 10
  - action: create_response
    input: "third"
    key: ovl-3
