name: mirror-dual-read
covers:
  - FR-10
  - INV-32
  - CR-5
oracles:
  - SeqMonotonic
  - SubmittedTurnsTerminal
trace: true
steps:
  - action: create_session
  - action: submit_turn
    text: mirror-me
    key: k-m1
    expect: accepted
  - action: claim_and_complete
    tokens: 3
  - action: mirror_sync
  - action: observe_both
    from_seq: 1
  - action: mirror_append
    expect: read_only
  - action: mirror_snapshot_put
    snapshot_seq: 99
    expect: read_only
