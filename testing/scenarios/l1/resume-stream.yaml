name: resume-stream
covers:
  - FR-8
  - FR-11
  - INV-12
oracles:
  - SeqMonotonic
  - SingleClaimPerAttempt
  - SubmittedTurnsTerminal
trace: true
steps:
  - action: create_session
  - action: submit_turn
    text: hello
    key: k-resume-1
  - action: expect_lock
    state: busy
  - action: claim_and_complete
    tokens: 5
  - action: expect_lock
    state: idle
  - action: resume_from
    from_seq: 1
    expect_min_events: 5
  - action: expect_no_gap
    from_seq: 1
