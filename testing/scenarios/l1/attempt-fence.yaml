name: attempt-fence
covers: [FR-5, FR-6, CR-3, CR-7, INV-5, INV-6]
oracles: [StaleAppendRejected, SingleClaimPerAttempt, SequenceContiguous]
steps:
  - action: create_response
    input: "work"
    key: fence-1
  - action: claim
  - action: append_delta
    payload: "ok"
  # Reaping raises the fence; the previous holder is now stale.
  - action: reap
  - action: append_delta
    payload: "zombie"
    attempt: 1
    expect_stale: true
