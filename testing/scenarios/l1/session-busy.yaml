name: session-busy
covers:
  - FR-3
  - FR-18
  - INV-29
oracles:
  - SeqMonotonic
  - SingleClaimPerAttempt
trace: true
steps:
  - action: create_session
  - action: submit_turn
    text: first
    key: k-busy-1
    expect: accepted
  - action: expect_lock
    state: busy
  - action: submit_turn
    text: second
    key: k-busy-2
    expect: busy
  - action: claim_and_complete
    tokens: 2
  - action: expect_lock
    state: idle
  - action: submit_turn
    text: after-idle
    key: k-busy-3
    expect: accepted
  - action: claim_and_complete
    tokens: 1
