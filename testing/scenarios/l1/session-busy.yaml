name: session-busy
covers:
  - FR-18
  - INV-29
oracles:
  - SeqMonotonic
  - SingleClaimPerAttempt
trace: true
steps:
  - action: create_session
  - action: submit_turn
    text: first
    key: k-busy-1
  - action: expect_lock
    state: busy
  - action: claim_and_complete
    tokens: 2
  - action: expect_lock
    state: idle
