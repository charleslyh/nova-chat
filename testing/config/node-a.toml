# Peer node A. All three nodes are equivalent: each can create, none is an
# authority. Execution and sweeping are separate processes over the shared
# carrier, so the gateway neither embeds an agent nor runs the sweeper.
#
# Secrets are absent by design — only the *names* of environment variables appear
# here (SEC-4).
#
# Top-level keys are assembly-layer knobs (which backend, how to reach it); the
# capability layer's config lives under `[responses]`.

[responses]
node_tag = "node-a"
listen = "127.0.0.1:18080"

# The sweep loop is a standalone process; the gateway must not run it.
run_sweeper = false

# Fixture value. Production defaults to 10 minutes so in-flight generations can
# finish; here a short budget keeps the port from stranding the next run.
drain_timeout_ms = 3000
